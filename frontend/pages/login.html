<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentKe | Login</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/forms.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a class="logo" href="../index.html">RentKe</a>
        <button class="menu-toggle" aria-label="Open menu">☰</button>
        <div class="nav-links">
          <a href="../index.html">Home</a>
          <a href="./properties.html">Find a House</a>
          <a href="./register.html">Sign Up</a>
        </div>
      </nav>
    </header>

    <main class="section auth-layout">
      <div class="auth-panel">
        <span class="eyebrow">Welcome back</span>
        <h1>Login to RentKe</h1>
        <p>Access your saved homes, inquiries, and dashboard with ease.</p>
        <form id="loginForm">
          <div class="search-form" style="grid-template-columns: 1fr;">
            <div class="search-field">
              <label for="loginEmail">Email</label>
              <input id="loginEmail" type="email" placeholder="you@example.com" required />
            </div>
            <div class="search-field">
              <label for="loginPassword">Password</label>
              <input id="loginPassword" type="password" placeholder="********" required />
            </div>
            <div class="search-field">
              <button type="button" class="btn btn-secondary" data-show-password="#loginPassword">Show</button>
            </div>
            <button class="btn btn-primary" type="submit">Login</button>
          </div>
        </form>
        <p id="authMessage" class="form-message"></p>
        <p><a href="#">Forgot password?</a> • <a href="./register.html">Create account</a></p>
      </div>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
